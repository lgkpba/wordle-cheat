<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/index.css">
    <title>Wordle Cheat</title>
</head>
<body>
    <div id="form">
        <label for="quantidade">Quantidade de letras</label>
        <select name="quantidade" id="quantidade">
            <option value="3">3 letras</option>
            <option value="4">4 letras</option>
            <option value="5" selected>5 letras</option>
            <option value="6">6 letras</option>
            <option value="7">7 letras</option>
            <option value="8">8 letras</option>
        </select>

        <h2>Letras na posição correta</h2>
        <div class="grid" id="corretas"></div>

        <h2>Letras existentes</h2>
        <div class="grid" id="existentes"></div>

        <h2>Letras excluídas</h2>
        <div class="grid" id="excluidas"></div>

        <button onclick="buscar()">Buscar</button>

        <div id="resultados">
            <h2>Resultados</h2>
            <p id="quantidadeResultados"></p>
            <ul id="listaResultados"></ul>
        </div>
    </div>
    <script src="script/index.js"></script>
</body>
</html>
